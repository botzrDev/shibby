[workspace]
resolver = "2"
members = [
    "crates/uat-core",
    "crates/uat-policy",
    "crates/uat-node",
    "crates/uat-mcp",
    "crates/uat-cli",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
biscuit-auth = "6.0.0"
anyhow = "1.0.104"
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
proptest = "1.6"
iroh = "1.1.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uat-core = { path = "crates/uat-core" }
uat-policy = { path = "crates/uat-policy" }
uat-node = { path = "crates/uat-node" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
