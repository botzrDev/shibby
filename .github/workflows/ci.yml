name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Root rust-toolchain.toml pins 1.91; cargo-fuzz needs nightly (-Zsanitizer).
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Short fuzz decode
        env:
          # Override the repo pin for this job only.
          RUSTUP_TOOLCHAIN: nightly
        run: cargo +nightly fuzz run decode --fuzz-dir fuzz -- -max_total_time=30
